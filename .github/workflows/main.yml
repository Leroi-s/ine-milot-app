name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Ajouter la plateforme Android (si absente)
        run: '[ -d android ] || npx cap add android'
      - name: Icônes et écran de démarrage depuis le logo
        run: |
          if [ -d assets ]; then
            npx capacitor-assets generate --android --iconBackgroundColor "#ffffff" --splashBackgroundColor "#ffffff"
          else
            echo "Pas de dossier assets : icône par défaut."
          fi
      - run: npx cap sync android
      - name: Compiler l'APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Nommer le fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk INE-Milot.apk
      - name: Publier le lien de téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Application INE Milot
          body: Dernière version de l'application Android INE Milot.
          make_latest: true
          files: INE-Milot.apk
